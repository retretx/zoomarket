<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients/paths -->
  <defs>
    <path id="textPathTop" d="M 120,250 A 130,130 0 0,1 380,250" fill="none" />
    <path id="textPathBottom" d="M 380,250 A 130,130 0 0,1 120,250" fill="none" />
  </defs>

  <!-- Outer Orange Circle Ring -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#F97316" stroke-width="25" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="250" cy="250" r="246" fill="none" stroke="#EA580C" stroke-width="2" />

  <!-- Inner beige background circle -->
  <circle cx="250" cy="250" r="208" fill="#FFFBEB" />

  <!-- Semi-circle split division for the stripe -->
  <path d="M 45,250 A 205,205 0 0,0 455,250 Z" fill="#FFFDF5" />

  <!-- Text: СЕТЬ ЗООМАРКЕТОВ (Top Circular Text) -->
  <style>
    .circular-text {
      font-family: 'Comfortaa', 'Arial Black', sans-serif;
      font-weight: 950;
      fill: #451A03;
      font-size: 32px;
      letter-spacing: 4px;
    }
    .main-banner-text {
      font-family: 'Comfortaa', 'Arial Black', sans-serif;
      font-weight: 950;
      fill: #FFFFFF;
      font-size: 64px;
      letter-spacing: 2px;
    }
  </style>
  
  <text class="circular-text" text-anchor="middle">
    <textPath href="#textPathTop" startOffset="50%">СЕТЬ ЗООМАРКЕТОВ</textPath>
  </text>
  
  <text class="circular-text" text-anchor="middle">
    <textPath href="#textPathBottom" startOffset="50%">СЕТЬ ЗООМАРКЕТОВ</textPath>
  </text>

  <!-- Paw prints on the sides -->
  <!-- Left Paw -->
  <g transform="translate(68, 250) scale(0.6)" fill="#451A03">
    <ellipse cx="0" cy="0" rx="16" ry="12" />
    <circle cx="-16" cy="-18" r="7" />
    <circle cx="0" cy="-24" r="8" />
    <circle cx="16" cy="-18" r="7" />
  </g>
  <!-- Right Paw -->
  <g transform="translate(432, 250) scale(0.6)" fill="#451A03">
    <ellipse cx="0" cy="0" rx="16" ry="12" />
    <circle cx="-16" cy="-18" r="7" />
    <circle cx="0" cy="-24" r="8" />
    <circle cx="16" cy="-18" r="7" />
  </g>

  <!-- Animal Characters (Dog, Cat, Bird) from uploaded image -->
  <!-- Background behind characters (soft warm yellow half-circle) -->
  <path d="M 100,250 A 150,150 0 0,1 400,250 Z" fill="#FEF3C7" opacity="0.8" />

  <!-- CAT (Left) -->
  <g transform="translate(195, 205) scale(1.15)">
    <!-- Ears -->
    <path d="M -30,-5 L -35,-42 L -10,-24 Z" fill="#D97706" />
    <path d="M -26,-10 L -31,-36 L -12,-24 Z" fill="#FEF3C7" />
    
    <!-- Cat Face/Head -->
    <path d="M -42,-12 C -42,-34 -12,-34 -12,-12 C -12,12 -42,12 -42,-12 Z" fill="#F59E0B" />
    
    <!-- Body/Paws -->
    <path d="M -38,10 C -38,28 -16,28 -16,10" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M -38,20 L -38,40 M -28,20 L -28,40 M -18,20 L -18,40" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
    
    <!-- Eyes -->
    <ellipse cx="-32" cy="-13" rx="2.5" ry="4" fill="#1C1917" />
    <ellipse cx="-20" cy="-13" rx="2.5" ry="4" fill="#1C1917" />
    
    <!-- Nose & Mouth & Whiskers -->
    <polygon points="-26,-7 -28,-9 -24,-9" fill="#F43F5E" />
    <path d="M -28,-5 C -28,-3 -26,-2 -26,-4 C -26,-2 -24,-3 -24,-5" stroke="#1C1917" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M -38,-7 L -30,-8 M -38,-4 L -31,-6 M -14,-7 L -22,-8 M -14,-4 L -21,-6" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- DOG (Center) -->
  <g transform="translate(255, 195) scale(1.2)">
    <!-- Ears -->
    <path d="M -32,-32 C -52,-52 -52,-12 -32,-8 Z" fill="#EA580C" />
    <path d="M 32,-32 C 52,-52 52,-12 32,-8 Z" fill="#EA580C" />
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="38" fill="#F97316" />
    
    <!-- Eyes -->
    <circle cx="-13" cy="-18" r="6" fill="#1C1917" />
    <circle cx="13" cy="-18" r="6" fill="#1C1917" />
    <circle cx="-15" cy="-20" r="2" fill="#FFFFFF" />
    <circle cx="11" cy="-20" r="2" fill="#FFFFFF" />
    
    <!-- Muzzle -->
    <path d="M -24,2 C -24,-14 24,-14 24,2 C 24,18 -24,18 -24,2 Z" fill="#FFEDD5" />
    <ellipse cx="0" cy="-3" rx="11" ry="8" fill="#1C1917" />
    <path d="M -15,5 Q 0,14 15,5" stroke="#1C1917" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Collar -->
    <path d="M -22,23 L 22,23" stroke="#451A03" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="27" r="7" fill="#F59E0B" stroke="#451A03" stroke-width="2" />
  </g>

  <!-- BIRD (Right) -->
  <g transform="translate(325, 205) scale(1.1)">
    <!-- Body -->
    <circle cx="10" cy="-6" r="24" fill="#78350F" />
    <circle cx="10" cy="-6" r="20" fill="#92400E" />
    
    <!-- Chest / Belly -->
    <path d="M -6,-14 A 18,18 0 0,0 12,12" stroke="#F97316" stroke-width="4" fill="none" />
    
    <!-- Eye -->
    <circle cx="3" cy="-12" r="3.5" fill="#1C1917" />
    <circle cx="4" cy="-13" r="1" fill="#FFFFFF" />
    
    <!-- Beak -->
    <polygon points="26,-15 36,-10 24,-6" fill="#FBBF24" />
    
    <!-- Legs -->
    <line x1="2" y1="18" x2="2" y2="34" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
    <line x1="14" y1="18" x2="14" y2="34" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Big Red/Orange Banner for brand name (from image bottom-center) -->
  <g transform="translate(0, 5)">
    <!-- Curving Banner Base -->
    <rect x="75" y="260" width="350" height="78" rx="16" fill="#F97316" stroke="#EA580C" stroke-width="4" />
    <text x="250" y="320" class="main-banner-text" text-anchor="middle">АЙБОЛИТ</text>
  </g>
</svg>
