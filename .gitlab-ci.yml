# Deploy static Next.js export to GitLab Pages.
# Site URL: Settings → Pages (after the first successful pipeline).

image: node:22-bookworm

stages:
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

pages:
  stage: deploy
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    # Project pages are served under /<project>; user/group pages stay at /.
    - |
      if [ -n "${CI_PAGES_URL:-}" ]; then
        export NEXT_PUBLIC_BASE_PATH="$(node -e "console.log(new URL(process.env.CI_PAGES_URL).pathname.replace(/\/$/,''))")"
      else
        export NEXT_PUBLIC_BASE_PATH="/${CI_PROJECT_NAME}"
      fi
      echo "NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH}"
    - npm run build
    # Job artifact must be a folder named `public` (Next already has its own public/).
    - rm -rf .pages-public
    - mv dist .pages-public
    - rm -rf public
    - mv .pages-public public
    - echo "Pages will be available at ${CI_PAGES_URL:-'(enable Pages in project settings)'}"
  pages: true
  artifacts:
    paths:
      - public
  environment:
    name: pages
    url: $CI_PAGES_URL
